<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Dev/Preview only: fix "dispatcher.useState is null" caused by duplicate React
      // instances from stale Vite dep chunks. In production, vite.config.js uses
      // resolve.dedupe and optimizeDeps.force which prevents this at the root.
      // This entire block must NOT run in production — it causes unwanted reloads
      // and cache deletion that break the production app experience.
      (function () {
        var isDev = (
          window.location.hostname.indexOf('preview') !== -1 ||
          window.location.hostname.indexOf('sandbox') !== -1 ||
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.pathname.indexOf('/editor/preview') !== -1 ||
          window.location.search.indexOf('preview') !== -1
        );
        if (!isDev) return;

        // Clear cached Vite chunks from the Cache API (dev only)
        if (window.caches) {
          caches.keys().then(function (names) {
            names.forEach(function (name) { caches.delete(name); });
          });
        }
        // Register service worker to bypass CDN cache for Vite chunks (dev only)
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          navigator.serviceWorker.register('/src/sw.js').catch(function () {});
        }
        // Proactive: force one cache-busting reload (dev only)
        var PROACTIVE_KEY = 'vite-proactive-reload';
        if (!sessionStorage.getItem(PROACTIVE_KEY)) {
          sessionStorage.setItem(PROACTIVE_KEY, '1');
          if (window.location.search.indexOf('fresh') === -1) {
            window.location.replace(window.location.pathname + '?fresh=' + Date.now());
            return;
          }
        } else {
          sessionStorage.removeItem(PROACTIVE_KEY);
        }
        // Reactive: if React error still occurs, force one more reload (dev only)
        var RELOAD_KEY = 'vite-cache-bust';
        window.addEventListener('error', function (e) {
          var msg = (e.error && e.error.message) || e.message || '';
          if (msg.indexOf('useState') !== -1 || msg.indexOf('dispatcher') !== -1) {
            if (!sessionStorage.getItem(RELOAD_KEY)) {
              sessionStorage.setItem(RELOAD_KEY, '1');
              var u = window.location.pathname;
              if (window.location.search.indexOf('fresh') === -1) {
                u += '?fresh=' + Date.now();
              }
              window.location.replace(u);
            }
          }
        }, true);
      })();
    </script>
  </body>
</html>
